<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Northstar Homes — Aanya</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --brand: #1c3d5a; --accent: #d9a441; --bg: #f4f6f8; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); margin: 0; }
  .wrap { max-width: 640px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: #fff; box-shadow: 0 0 24px rgba(0,0,0,0.06); }
  header { background: var(--brand); color: #fff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: flex-start; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: 0.8; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; margin-bottom: 10px; line-height: 1.4; font-size: 14px; white-space: pre-wrap; }
  .user { background: var(--brand); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .bot { background: #eef1f4; color: #222; margin-right: auto; border-bottom-left-radius: 4px; }
  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e5e5e5; }
  .composer input { flex: 1; padding: 10px 12px; border-radius: 20px; border: 1px solid #ccc; font-size: 14px; }
  .composer button { background: var(--accent); border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: 600; }
  .end-btn, .logout-btn { background: none; border: 1px solid #fff; color: #fff; border-radius: 14px; padding: 4px 10px; font-size: 11px; cursor: pointer; margin-top: 6px; margin-left: 6px; }
  #analytics { display:none; margin: 12px 16px; padding: 12px; background: #fffaf0; border: 1px solid var(--accent); border-radius: 8px; font-size: 12px; white-space: pre-wrap; }
  #analytics h3 { margin: 0 0 8px; font-size: 13px; color: var(--brand); }

  /* --- auth screen --- */
  #authScreen { max-width: 360px; margin: 60px auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 0 24px rgba(0,0,0,0.08); }
  #authScreen h2 { margin-top: 0; color: var(--brand); font-size: 18px; }
  #authScreen input { width: 100%; padding: 10px 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
  #authScreen button { width: 100%; background: var(--accent); border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; margin-top: 4px; }
  #authScreen .toggle { text-align: center; font-size: 12px; margin-top: 12px; color: var(--brand); cursor: pointer; text-decoration: underline; }
  #authError { color: #c0392b; font-size: 12px; margin-bottom: 8px; min-height: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- LOGIN / SIGNUP SCREEN -->
<div id="authScreen">
  <h2 id="authTitle">Log in</h2>
  <div id="authError"></div>
  <input id="authUsername" placeholder="Username" autocomplete="username" />
  <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password" />
  <button onclick="handleAuthSubmit()">Log in</button>
  <div class="toggle" onclick="toggleAuthMode()">New here? Sign up instead</div>
</div>

<!-- CHAT SCREEN -->
<div class="wrap hidden" id="chatScreen">
  <header>
    <div>
      <h1>Northstar Homes — chat with Aanya</h1>
      <p>Northstar One · Sector 79, Gurugram · 2 & 3 BHK</p>
    </div>
    <div>
      <button class="end-btn" onclick="endConversation()">End conversation</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>
  <div id="chat"></div>
  <div id="analytics"></div>
  <div class="composer">
    <input id="input" placeholder="Type a message… (English / Hindi / Hinglish)" onkeydown="if(event.key==='Enter') sendMessage()" />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
let sessionId = null;
let ended = false;
let authMode = 'login'; // or 'signup'

// ---------- AUTH ----------

function getToken() {
  return localStorage.getItem('access_token');
}

function toggleAuthMode() {
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('authTitle').textContent = authMode === 'login' ? 'Log in' : 'Sign up';
  document.querySelector('#authScreen button[onclick="handleAuthSubmit()"]').textContent = authMode === 'login' ? 'Log in' : 'Sign up';
  document.querySelector('.toggle').textContent = authMode === 'login' ? 'New here? Sign up instead' : 'Already have an account? Log in';
  document.getElementById('authError').textContent = '';
}

async function handleAuthSubmit() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const errorBox = document.getElementById('authError');
  errorBox.textContent = '';

  if (!username || !password) {
    errorBox.textContent = 'Please enter both username and password.';
    return;
  }

  const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/signup';

  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errorBox.textContent = data.detail || 'Something went wrong.';
      return;
    }
    localStorage.setItem('access_token', data.access_token);
    localStorage.setItem('username', username);
    enterChat();
  } catch (err) {
    errorBox.textContent = 'Could not reach server.';
  }
}

function logout() {
  localStorage.removeItem('access_token');
  localStorage.removeItem('username');
  sessionId = null;
  ended = false;
  document.getElementById('chat').innerHTML = '';
  document.getElementById('analytics').style.display = 'none';
  document.getElementById('chatScreen').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
}

// authenticated fetch wrapper — attaches the JWT automatically
async function authFetch(url, options = {}) {
  const token = getToken();
  const headers = Object.assign({}, options.headers, {
    'Authorization': 'Bearer ' + token
  });
  const res = await fetch(url, Object.assign({}, options, { headers }));
  if (res.status === 401) {
    // token expired / invalid — send back to login
    logout();
    throw new Error('Session expired, please log in again.');
  }
  return res;
}

// ---------- CHAT ----------

function addMsg(text, who) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  if (ended) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  const res = await authFetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sessionId, message: text})
  });
  const data = await res.json();
  sessionId = data.session_id;
  addMsg(data.reply, 'bot');
  if (data.ended) {
    ended = true;
    await showAnalytics();
  }
}

async function endConversation() {
  if (!sessionId || ended) return;
  ended = true;
  await authFetch('/api/end/' + sessionId, { method: 'POST' });
  await showAnalytics();
}

async function showAnalytics() {
  if (!sessionId) return;
  const res = await authFetch('/api/analytics/' + sessionId);
  const data = await res.json();
  const box = document.getElementById('analytics');
  box.style.display = 'block';
  box.innerHTML = '<h3>Conversation analytics</h3>' + JSON.stringify(data, null, 2);
}

async function startGreeting() {
  const res = await authFetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: null, message: 'Hi'})
  });
  const data = await res.json();
  sessionId = data.session_id;
  addMsg(data.reply, 'bot');
}

function enterChat() {
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');
  startGreeting();
}

// ---------- INIT ----------
window.onload = () => {
  if (getToken()) {
    enterChat();
  }
  // else: authScreen already shown by default
};
</script>
</body>
</html>
