[tool.poetry]
name = "northstar-bot"
version = "0.1.0"
description = "Northstar Homes AI sales agent — FastAPI backend (Groq-powered)"
authors = ["Divyansh"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.6"}
pydantic = "^2.9.2"
groq = "^0.31.0"
python-dotenv = "^1.0.1"
motor = "^3.7.1"
pymongo = "^4.17.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
python-multipart = "^0.0.32"
email-validator = "^2.3.0"
bcrypt = "4.0.1"
slowapi = "^0.1.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
